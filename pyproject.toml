[project]
name = "jupyagent"
version = "0.1.0"
description = "Agent-first CLI for inspecting and editing Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "nbformat>=5.10.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
]

[project.scripts]
jupyagent = "jupyagent.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jupyagent"]

[tool.uv]
package = true
